[build]
  # The storefront is checked in and does not need a build step.
  command = ""
  publish = "outputs/recy-light"
  edge_functions = "outputs/recy-light/netlify/edge-functions"

# Preserve the admin route protection from the storefront configuration.
[[edge_functions]]
  function = "admin-auth"
  path = "/admin.html"

[[edge_functions]]
  function = "admin-auth"
  path = "/login.html"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
