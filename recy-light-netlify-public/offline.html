<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#142131">
  <meta name="robots" content="noindex">
  <title>You're offline — RecyLight Ltd</title>
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#fbfaf6;color:#172536;font-family:Arial,sans-serif}.offline-card{width:min(440px,100%);padding:36px 30px;border:1px solid #e8e9e5;border-radius:24px;background:#fff;text-align:center;box-shadow:0 20px 60px #14213112}.offline-mark{display:grid;place-items:center;width:70px;height:70px;margin:0 auto 20px;border-radius:20px;background:#142131;color:#b1d640;font-size:38px}.offline-card h1{margin:0 0 10px;font-size:28px;letter-spacing:-.7px}.offline-card p{margin:0 auto 24px;color:#66727c;font-size:15px;line-height:1.6}.offline-card button{padding:12px 20px;border:0;border-radius:999px;background:#142131;color:white;font-size:14px;font-weight:700;cursor:pointer}.offline-note{display:block;margin-top:18px;color:#818a90;font-size:11px}
  </style>
</head>
<body>
  <main class="offline-card">
    <span class="offline-mark" aria-hidden="true">✦</span>
    <h1>You’re offline</h1>
    <p>Reconnect to the internet to continue browsing RecyLight. Your cart may still be saved on this device, but orders and payments cannot be completed offline.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small class="offline-note">RecyLight Ltd · Turning plastic into light</small>
  </main>
</body>
</html>
